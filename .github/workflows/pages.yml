# Демо-показ на GitHub Pages: публікує папку public/ (лише для погодження з клієнтом;
# бойовий магазин працює на Cloudflare Pages, бо GitHub Pages не дозволяє e-commerce).
name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # адмінка працює лише на Cloudflare (потрібні функції й вхід), у демо її не публікуємо
      - run: rm -rf public/admin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
