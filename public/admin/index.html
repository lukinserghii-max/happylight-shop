<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'">
<title>HappyLight · адмінка</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b1a26'/%3E%3Ccircle cx='32' cy='28' r='15' fill='%23f2b45a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="admin.css?v=2">
<script src="admin.js?v=2" defer></script>
</head>
<body>
<header class="bar">
  <div class="brand"><b>HappyLight</b><span>адмінка</span></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="products" aria-selected="true">Товари</button>
    <button role="tab" data-tab="bulk" aria-selected="false">Ціни масово</button>
    <button role="tab" data-tab="site" aria-selected="false">Сайт</button>
    <button role="tab" data-tab="history" aria-selected="false">Історія</button>
  </nav>
  <div class="save">
    <span class="status" data-status aria-live="polite">Завантаження…</span>
    <button class="btn ghost" type="button" data-discard hidden>Скасувати зміни</button>
    <button class="btn primary" type="button" data-publish disabled>Зберегти на сайт</button>
  </div>
</header>

<main>
  <!-- Товари -->
  <section data-panel="products" class="panel">
    <div class="filters">
      <select data-cat-filter aria-label="Розділ"></select>
      <input type="search" data-search placeholder="Пошук за назвою" aria-label="Пошук">
      <label class="chk"><input type="checkbox" data-only-hidden> лише приховані</label>
    </div>
    <div class="layout">
      <ul class="list" data-list></ul>
      <div class="editor" data-editor><p class="empty">Оберіть товар зі списку.</p></div>
    </div>
  </section>

  <!-- Масова зміна цін -->
  <section data-panel="bulk" class="panel" hidden>
    <h2>Змінити ціни на відсоток</h2>
    <div class="card form">
      <fieldset><legend>Розділи</legend><div class="cats" data-bulk-cats></div></fieldset>
      <div class="row">
        <label>Змінити на, %<input type="number" step="0.5" data-bulk-pct value="10"></label>
        <label>Округлити до, грн<select data-bulk-round><option value="1">1</option><option value="5">5</option><option value="10" selected>10</option><option value="50">50</option></select></label>
      </div>
      <label class="chk"><input type="checkbox" data-bulk-old> змінювати й старі (закреслені) ціни</label>
      <label class="chk"><input type="checkbox" data-bulk-addons> змінювати ціни опцій (диммер, провід, лампочки)</label>
      <div class="row"><button class="btn" type="button" data-bulk-preview>Показати, що зміниться</button></div>
    </div>
    <div data-bulk-result></div>
  </section>

  <!-- Сайт -->
  <section data-panel="site" class="panel" hidden>
    <h2>Налаштування сайту</h2>
    <div class="card form">
      <label>Відео на сайті (посилання YouTube)<input type="url" data-video placeholder="https://www.youtube.com/watch?v=…"></label>
      <p class="hint" data-video-hint></p>
      <label>Виділений розділ (велика плашка першою)<select data-featured></select></label>
    </div>
    <h2>Розділи</h2>
    <div class="card" data-cats-edit></div>
  </section>

  <!-- Історія -->
  <section data-panel="history" class="panel" hidden>
    <h2>Попередні версії</h2>
    <p class="hint">Кожне збереження створює версію. Відновлена версія теж зберігається, тож відкат можна скасувати.</p>
    <ul class="hist" data-history></ul>
  </section>
</main>

<div class="toast" data-toast role="status" aria-live="polite"></div>
</body>
</html>
